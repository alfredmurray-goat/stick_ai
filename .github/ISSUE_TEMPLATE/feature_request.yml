name: Feature request
description: Suggest an idea for Stick AI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the moment where Stick AI falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What could Stick AI do?
      description: Describe how you picture it working.
    validations:
      required: true
