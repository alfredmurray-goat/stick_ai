name: Bug report
description: Something in Stick AI isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Open Stick AI and click Open workspace
        2. Ask Stellan something
        3. …
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Operating system and computer
      placeholder: macOS 15.4, MacBook Air (M2, 16 GB)
    validations:
      required: true
  - type: dropdown
    id: download
    attributes:
      label: Which download?
      options:
        - Complete (Lite + Max included)
        - Model-free (I linked my own GGUFs)
        - Mac DMG
        - Built from source
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: The release tag you downloaded, for example desktop-44284459765.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. The end of `logs/launcher.log` inside the app folder.
      render: text
