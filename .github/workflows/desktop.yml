name: Desktop builds — Lite + Max
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'portable/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-platform.ts'
      - 'scripts/build-app-update.ts'
      - 'scripts/fetch-platform-assets.mjs'
      - 'scripts/smoke*.mjs'
      - '.github/workflows/desktop*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-unified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-x64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: macos-15-intel
      target: x86_64-apple-darwin
      name: macos-x64
      node: darwin-x64
      archive: tar.gz
      app: bundle/macos/Stick AI.app
      server: bin/llama-server
      executable: bin/node
  macos-arm64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      name: macos-arm64
      node: darwin-arm64
      archive: tar.gz
      app: bundle/macos/Stick AI.app
      server: bin/llama-server
      executable: bin/node
  windows-x64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: windows-2022
      target: x86_64-pc-windows-msvc
      name: windows-x64
      node: win-x64
      archive: zip
      app: stick-ai.exe
      server: bin/Release/llama-server.exe
      executable: node.exe
  linux-x64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      name: linux-x64
      node: linux-x64
      archive: tar.gz
      app: stick-ai
      server: bin/llama-server
      executable: bin/node
  publish:
    needs: [macos-x64, macos-arm64, windows-x64, linux-x64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start publication after all four platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          gh workflow run release.yml --ref main -f build_run="$BUILD_RUN"
          gh workflow run macos-dmg.yml --ref main -f build_run="$BUILD_RUN"
