name: Desktop builds — Lite + Max
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'portable/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-platform.ts'
      - 'scripts/build-app-update.ts'
      - 'scripts/fetch-platform-assets.mjs'
      - 'scripts/smoke*.mjs'
      - 'scripts/extension-smoke.mjs'
      - '.github/workflows/desktop*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-unified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-x64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: macos-15-intel
      target: x86_64-apple-darwin
      name: macos-x64
      node: darwin-x64
      archive: tar.gz
      app: bundle/macos/Stick AI.app
      server: bin/llama-server
      executable: bin/node
  macos-arm64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: macos-15
      target: aarch64-apple-darwin
      name: macos-arm64
      node: darwin-arm64
      archive: tar.gz
      app: bundle/macos/Stick AI.app
      server: bin/llama-server
      executable: bin/node
  windows-x64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: windows-2022
      target: x86_64-pc-windows-msvc
      name: windows-x64
      node: win-x64
      archive: zip
      app: stick-ai.exe
      server: bin/Release/llama-server.exe
      executable: node.exe
  linux-x64:
    uses: ./.github/workflows/desktop-platform.yml
    with:
      os: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      name: linux-x64
      node: linux-x64
      archive: tar.gz
      app: stick-ai
      server: bin/llama-server
      executable: bin/node
  # The all-devices stick has one Mac app, so merge the Intel and Apple Silicon executables into a
  # universal binary and ad-hoc sign the bundle again (the stick is unsigned like the platform builds).
  macos-universal:
    needs: [macos-x64, macos-arm64]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stick_ai-macapp-macos-arm64
          path: arm
      - uses: actions/download-artifact@v4
        with:
          name: stick_ai-macapp-macos-x64
          path: intel
      - name: Merge the Intel and Apple Silicon apps
        run: |
          set -euo pipefail
          tar -xf arm/stick_ai-macapp-macos-arm64.tar -C arm
          tar -xf intel/stick_ai-macapp-macos-x64.tar -C intel
          mkdir out
          cp -R "arm/Stick AI.app" "out/Stick AI.app"
          diff -rq -x stick-ai -x _CodeSignature "arm/Stick AI.app" "intel/Stick AI.app" || echo "Note: bundle resources differ; using the Apple Silicon copy"
          lipo -create "arm/Stick AI.app/Contents/MacOS/stick-ai" "intel/Stick AI.app/Contents/MacOS/stick-ai" -output "out/Stick AI.app/Contents/MacOS/stick-ai"
          lipo -verify_arch "out/Stick AI.app/Contents/MacOS/stick-ai" x86_64 arm64
          codesign --force --deep --sign - "out/Stick AI.app"
          codesign --verify --deep --strict "out/Stick AI.app"
          "out/Stick AI.app/Contents/MacOS/stick-ai" --dry-run
          if arch -x86_64 /usr/bin/true 2>/dev/null; then arch -x86_64 "out/Stick AI.app/Contents/MacOS/stick-ai" --dry-run; else echo "Rosetta unavailable; Intel slice checked by lipo only"; fi
          tar -cf stick_ai-macapp-universal.tar -C out "Stick AI.app"
      - uses: actions/upload-artifact@v4
        with:
          name: stick_ai-macapp-universal
          path: stick_ai-macapp-universal.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [macos-x64, macos-arm64, windows-x64, linux-x64, macos-universal]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start publication after all four platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          gh workflow run release.yml --ref main -f build_run="$BUILD_RUN"
