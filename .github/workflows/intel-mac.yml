name: Intel Mac app
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intel-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Stick AI.app
            src-tauri/Cargo.lock
          key: intel-native-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/src/**', 'src-tauri/build.rs', 'src-tauri/tauri.conf.json', 'src-tauri/capabilities/**', 'src-tauri/icons/**', 'portable/ui/**') }}
      - name: Build the Intel desktop app
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: npx --yes @tauri-apps/cli@2.12.2 build --target x86_64-apple-darwin --bundles app
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Stick AI.app
            src-tauri/Cargo.lock
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Download and verify Lite and portable Node
        run: node scripts/fetch-intel-assets.mjs release-assets
      - name: Extract portable Node
        run: tar -xzf release-assets/node-v24.22.1-darwin-x64.tar.gz -C release-assets
      - name: Build our Stellan-Run engine
        run: |
          cmake -S experimental/stellan-runtime -B release-assets/stellan-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.5
          cmake --build release-assets/stellan-build --parallel 3
          ctest --test-dir release-assets/stellan-build --output-on-failure
      - name: Collect native redistribution notices
        run: |
          node scripts/native-licenses.mjs release-assets/desktop-licenses
      - name: Assemble the complete Intel Mac folder
        shell: bash
        run: |
          node scripts/package-intel.ts --out "dist/Stick AI Intel" --app "src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Stick AI.app" --node release-assets/node-v24.22.1-darwin-x64/bin/node --node-license release-assets/node-v24.22.1-darwin-x64/LICENSE --server release-assets/stellan-build/stellan-run --server-license LICENSE --lite release-assets/stellan-1-lite-q4_k_m.gguf --desktop-licenses release-assets/desktop-licenses
      - name: Verify the real Lite server and tagged chat response
        run: node scripts/smoke-intel.mjs "dist/Stick AI Intel"
      - name: Preserve executable bits in the download
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Stick AI Intel" dist/stick_ai-intel-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stick_ai-intel-mac
          path: dist/stick_ai-intel-mac.zip
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-build-diagnostics
          path: |
            src-tauri/Cargo.lock
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            release-assets/smoke.log
            release-assets/model-smoke.json
          if-no-files-found: ignore
          retention-days: 3
