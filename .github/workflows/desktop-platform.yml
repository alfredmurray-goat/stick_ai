name: Build one desktop platform
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      name:
        required: true
        type: string
      node:
        required: true
        type: string
      archive:
        required: true
        type: string
      app:
        required: true
        type: string
      server:
        required: true
        type: string
      executable:
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      LLAMA_COMMIT: cd959bae99ff4bed22bef2604f45241c09bbb8c8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run licenses
      - run: npm run desktop:dry-run
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: src-tauri/target/${{ inputs.target }}/release/${{ inputs.app }}
          key: desktop-native-${{ inputs.name }}-${{ inputs.name == 'windows-x64' && 'static-crt-' || '' }}${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/src/**', 'src-tauri/build.rs', 'src-tauri/tauri.conf.json', 'src-tauri/capabilities/**', 'src-tauri/icons/**', 'portable/ui/**') }}
      - name: Build the native desktop app
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npx --yes @tauri-apps/cli@2.12.2 build --target ${{ inputs.target }} --bundles app
          else
            npx --yes @tauri-apps/cli@2.12.2 build --target ${{ inputs.target }} --no-bundle
          fi
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/target/${{ inputs.target }}/release/${{ inputs.app }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Download verified Lite and portable Node
        run: node scripts/fetch-platform-assets.mjs release-assets
      - name: Extract portable Node
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            7z x release-assets/node-v24.22.1-${{ inputs.node }}.${{ inputs.archive }} -orelease-assets -y
          else
            tar -xf release-assets/node-v24.22.1-${{ inputs.node }}.${{ inputs.archive }} -C release-assets
          fi
      - uses: actions/cache/restore@v4
        id: server-cache
        with:
          path: |
            release-assets/llama-build/${{ inputs.server }}
            release-assets/llama.cpp/LICENSE
          key: desktop-server-${{ inputs.name }}-v0.9.0-static-crt-no-openmp-no-tls
      - name: Build the pinned Mamba2-compatible server
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: |
          git init release-assets/llama.cpp
          git -C release-assets/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C release-assets/llama.cpp fetch --depth 1 origin "$LLAMA_COMMIT"
          git -C release-assets/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C release-assets/llama.cpp rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -S release-assets/llama.cpp -B release-assets/llama-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build release-assets/llama-build --config Release --target llama-server -j 3
      - uses: actions/cache/save@v4
        if: steps.server-cache.outputs.cache-hit != 'true'
        with:
          path: |
            release-assets/llama-build/${{ inputs.server }}
            release-assets/llama.cpp/LICENSE
          key: ${{ steps.server-cache.outputs.cache-primary-key }}
      - name: Collect native redistribution notices
        run: |
          node scripts/native-licenses.mjs release-assets/desktop-licenses
          curl --fail --location --retry 3 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_COMMIT" --output release-assets/desktop-licenses/llama.cpp-source.tar.gz
      - name: Assemble the app and Lite with the pinned Max manifest
        run: |
          node scripts/package-platform.ts --out "dist/Stick AI" --app "src-tauri/target/${{ inputs.target }}/release/${{ inputs.app }}" --node release-assets/node-v24.22.1-${{ inputs.node }}/${{ inputs.executable }} --node-license release-assets/node-v24.22.1-${{ inputs.node }}/LICENSE --server release-assets/llama-build/${{ inputs.server }} --server-license release-assets/llama.cpp/LICENSE --lite release-assets/stellan-1-lite-q4_k_m.gguf --desktop-licenses release-assets/desktop-licenses --max-release
      - name: Remove copied inputs before archiving
        run: rm -f release-assets/stellan-1-lite-q4_k_m.gguf release-assets/node-*.tar.gz release-assets/node-*.zip
      - name: Verify native startup and real Lite tool exchange
        run: node scripts/smoke-platform.mjs "dist/Stick AI"
      - name: Build the app update without model weights
        run: node scripts/build-app-update.ts "dist/Stick AI" dist/stick_ai-update-${{ inputs.name }}.gz
      - uses: actions/upload-artifact@v4
        with:
          name: stick_ai-update-${{ inputs.name }}
          path: dist/stick_ai-update-${{ inputs.name }}.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Archive the internal base with permissions
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cd dist
            zip -q -0 -r stick_ai-${{ inputs.name }}.zip "Stick AI"
          elif [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip -mx=0 dist/stick_ai-${{ inputs.name }}.zip "./dist/Stick AI"
          else
            tar -cf - -C dist "Stick AI" | gzip -1 > dist/stick_ai-${{ inputs.name }}.tar.gz
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stick_ai-base-${{ inputs.name }}
          path: |
            dist/stick_ai-${{ inputs.name }}.zip
            dist/stick_ai-${{ inputs.name }}.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ inputs.name }}
          path: |
            src-tauri/Cargo.lock
            release-assets/smoke.log
            release-assets/model-smoke.json
          if-no-files-found: ignore
          retention-days: 1
