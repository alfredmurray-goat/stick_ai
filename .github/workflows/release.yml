name: Publish desktop release
on:
  workflow_run:
    workflows: ["Desktop builds — Lite + Max"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Desktop builds run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-release-${{ github.event.workflow_run.id || inputs.build_run }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Free disk space for the two-model packages
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/lib/jvm /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
          df -h /
      - name: Publish all four checked desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          STICK_UPDATE_SIGNING_KEY: ${{ secrets.STICK_UPDATE_SIGNING_KEY }}
          BUILD_RUN: ${{ github.event.workflow_run.id || inputs.build_run }}
        run: node scripts/publish-release.mjs
