name: Experimental Stellan runtime

on:
  workflow_dispatch:
  push:
    branches: [experimental/stellan-runtime]
    paths:
      - experimental/stellan-runtime/**
      - .github/workflows/stellan-runtime.yml
  pull_request:
    paths:
      - experimental/stellan-runtime/**
      - .github/workflows/stellan-runtime.yml

permissions:
  contents: read

concurrency:
  group: stellan-runtime-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Test tokenizer, RAM lock and promotion rules
        run: node --test experimental/stellan-runtime/tests/node-checks.mjs
      - name: Configure
        run: cmake -S experimental/stellan-runtime -B experimental/stellan-runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build experimental/stellan-runtime/build --config Release --parallel 2
      - name: Test native core and GGUF validation
        run: ctest --test-dir experimental/stellan-runtime/build -C Release --output-on-failure --timeout 60
      - name: Compare ARM prefill kernels on the same runner
        if: matrix.os == 'macos-15' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          cmake --build experimental/stellan-runtime/build --config Release --parallel 2 --target stellan-batch-bench
          python3 experimental/stellan-runtime/bench/compare-batch.py experimental/stellan-runtime/build/stellan-batch-bench experimental/stellan-runtime/arm-batch-ci.json untiled
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15' || matrix.os == 'ubuntu-24.04-arm'
        with:
          name: stellan-arm-batch-comparison-${{ matrix.os }}
          path: experimental/stellan-runtime/arm-batch-ci.json
          overwrite: true
          if-no-files-found: error

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure sanitizers
        run: cmake -S experimental/stellan-runtime -B experimental/stellan-runtime/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Build
        run: cmake --build experimental/stellan-runtime/build --parallel 2
      - name: Test memory and arithmetic safety
        run: ctest --test-dir experimental/stellan-runtime/build --output-on-failure --timeout 60
