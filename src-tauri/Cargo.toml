[package]
name = "stick-ai"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["localilabs"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
